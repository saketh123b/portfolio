<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meta | Saketh Birru</title>
  <link rel="stylesheet" href="../style.css">
  <script src="../global.js" type="module"></script>
</head>
<body>
  <h1>Meta</h1>
  <p>Statistics about the code of this website, computed with
     <code>elocuent</code> and visualized with D3.</p>

  <!-- Summary stats: filled in by renderCommitInfo() -->
  <section id="summary">
    <h2>Summary stats</h2>
    <div id="stats"></div>
  </section>

  <!-- Commit timeline: the slider and the scrolling story both control it -->
  <section id="timeline">
    <h2>Commits by time of day</h2>

    <label for="commit-slider" class="slider-label">
      Show commits until:
      <input type="range" id="commit-slider" min="0" max="100" value="100">
      <time id="slider-time"></time>
    </label>

    <div id="scrolly-1">
      <div id="scatter-story"></div>
      <div id="scatter-plot">
        <div id="chart"></div>
        <p id="selection-count">No commits selected</p>
        <dl id="language-breakdown" class="stats"></dl>
      </div>
    </div>
  </section>

  <!-- Files: one row per file, one dot per line of code -->
  <section id="file-list">
    <h2>Files</h2>
    <dl id="files"></dl>
  </section>

  <!-- Hover tooltip for commit dots (positioned by JS, so it lives outside the sections) -->
  <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank" rel="noopener"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
  </dl>

  <script type="module" src="main.js"></script>
</body>
</html>
